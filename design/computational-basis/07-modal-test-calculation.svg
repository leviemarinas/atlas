e-linejoin="round"><path d="M4.5 12.8 9.5 17.8 19.5 6.6" stroke="#147b4d"/></g><text x="501.81" y="467.91" font-family="Poppins, Arial, sans-serif" font-size="7.5" fill="#147b4d">Formula passed</text><text x="501.81" y="485.87" font-family="Poppins, Arial, sans-serif" font-size="13" fill="#147b4d" font-weight="600">₱ 1,293.08</text><rect x="336.5" y="517.25" width="927" height="61" fill="#ffffff"/><line x1="335" y1="516.25" x2="1265" y2="516.25" stroke="#e8e7ed" stroke-width="1"/><rect x="1127.62" y="529.25" width="119.38" height="38" rx="4" fill="#54248f"/><text x="1142.62" y="552.15" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="500">Validate and save</text><rect x="1054.41" y="529.25" width="64.21" height="38" rx="4" fill="#ffffff" stroke="#b98ee3" stroke-width="1"/><text x="1069.41" y="552.15" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#7a40b4" font-weight="500">Cancel</text></g><g id="Notes"><rect x="335" y="604.25" width="930" height="38.5" rx="6" fill="#ffffff" stroke="#e2d6ee" stroke-width="1" opacity="0.92"/><text x="347" y="624.25" font-family="Poppins, Arial, sans-serif" font-size="8.5" fill="#5a4d64">Only the fields the expression actually references get a test input, so the grid grows and shrinks with the formula. A failing run replaces this green result with the .basis-error band and forces the Formula setup tab.</text></g></g></svg>