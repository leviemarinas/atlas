<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="690" viewBox="0 0 1600 690"><g id="07 Formula editor · Test calculation"><rect x="0" y="0" width="1600" height="690" fill="#f7f8fb"/><rect x="0" y="0" width="1600" height="690" fill="#1a171f" opacity="0.62" id="Backdrop"/><g id="Formula editor"><rect x="335" y="109.75" width="930" height="470.5" rx="3" fill="#ffffff" stroke="#54248f" stroke-width="2"/><text x="353" y="144.78" font-family="Poppins, Arial, sans-serif" font-size="17" fill="#25212d" font-weight="500">Edit computation · ERN-002</text><line x1="335" y1="167.75" x2="1265" y2="167.75" stroke="#e6e4ea" stroke-width="1"/><g transform="translate(1216.5 128.25) scale(0.875)" fill="none" stroke="#25212d" stroke-width="2.17" stroke-linecap="round" stroke-linejoin="round"><line x1="5.5" y1="5.5" x2="18.5" y2="18.5" stroke="#25212d"/><line x1="18.5" y1="5.5" x2="5.5" y2="18.5" stroke="#25212d"/></g><line x1="335" y1="210.75" x2="1265" y2="210.75" stroke="#e8e7ed" stroke-width="1"/><text x="355" y="193.12" font-family="Poppins, Arial, sans-serif" font-size="9.5" fill="#746e79">Formula setup</text><text x="434.8" y="193.12" font-family="Poppins, Arial, sans-serif" font-size="9.5" fill="#54248f" font-weight="600">Test calculation</text><rect x="434.8" y="208.75" width="71.77" height="2" fill="#54248f"/><text x="524.57" y="193.12" font-family="Poppins, Arial, sans-serif" font-size="9.5" fill="#746e79">Change details</text><rect x="355" y="227.75" width="890" height="61.5" rx="7" fill="#f2ebfa"/><g transform="translate(370 243.5) scale(1.25)" fill="none" stroke="#54248f" stroke-width="1.52" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3.5h6" stroke="#54248f"/><path d="M10 3.5v5.2L4.8 18a1.6 1.6 0 0 0 1.4 2.5h11.6a1.6 1.6 0 0 0 1.4-2.5L14 8.7V3.5" stroke="#54248f"/><line x1="6.6" y1="14.2" x2="17.4" y2="14.2" stroke="#54248f"/></g><text x="411" y="256.01" font-family="Poppins, Arial, sans-serif" font-size="12" fill="#54248f" font-weight="600">Test