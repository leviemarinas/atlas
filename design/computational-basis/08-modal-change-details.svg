="1"/><text x="365" y="324.98" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#39343e">2026-08-17</text><g transform="translate(593 315.07) scale(0.5)" fill="none" stroke="#75717e" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 9.5 12 15.5l6.5-6" stroke="#75717e"/></g><text x="355" y="363.25" font-family="Poppins, Arial, sans-serif" font-size="9.5" fill="#4e4954" font-weight="500">Change note</text><rect x="355" y="371.05" width="650" height="72" rx="4" fill="#ffffff" stroke="#d7d5dc" stroke-width="1"/><text x="365" y="390.95" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#39343e">Updated through the Computational Basis workspace.</text><rect x="355" y="458.25" width="210" height="56" rx="6" fill="#ffffff" stroke="#e8e7ed" stroke-width="1"/><text x="365" y="481.09" font-family="Poppins, Arial, sans-serif" font-size="8" fill="#75717e">Current version</text><text x="365" y="499.8" font-family="Poppins, Arial, sans-serif" font-size="10" fill="#3f3746" font-weight="600">1.0</text><rect x="575" y="458.25" width="210" height="56" rx="6" fill="#ffffff" stroke="#e8e7ed" stroke-width="1"/><text x="585" y="481.09" font-family="Poppins, Arial, sans-serif" font-size="8" fill="#75717e">Next version</text><text x="585" y="499.8" font-family="Poppins, Arial, sans-serif" font-size="10" fill="#3f3746" font-weight="600">1.1</text><rect x="795" y="458.25" width="210" height="56" rx="6" fill="#ffffff" stroke="#e8e7ed" stroke-width="1"/><text x="805" y="481.09" font-family="Poppins, Arial, sans-serif" font-size="8" fill="#75717e">Changed by</text><text x="805" y="499.8" font-family="Poppins, Arial, sans-serif" font-size="10" fill="#3f3746" font-weight="600">Client Admin</text><rect x="336.5" y="535.25" width="927" height="61" fill="#ffffff"/><line x1="335" y1="534.25" x2="1265" y2="534.25" stroke="#e8e7ed" stroke-width="1"/><rect x="1127.62" y="547.25" width="119.38" height="38" rx="4" fill="#54248f"/><text x="1142.62" y="570.15" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="500">Validate and save</text><rect x="1054.41" y="547.25" width="64.21" height="38" rx="4" fill="#ffffff" stroke="#b98ee3" stroke-width="1"/><text x="1069.41" y="570.15" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#7a40b4" font-weight="500">Cancel</text></g><g id="Notes"><rect x="335" y="622.25" width="930" height="38.5" rx="6" fill="#ffffff" stroke="#e2d6ee" stroke-width="1" opacity="0.92"/><text x="347" y="642.25" font-family="Poppins, Arial, sans-serif" font-size="8.5" fill="#5a4d64">Version numbers are derived, never typed: saving an existing computation bumps 1.0 to 1.1, and creating one starts at 1.0 with Ownership &quot;Company&quot;. Creating swaps these three cells to Initial version / Ownership / Created by.</text></g></g></svg>