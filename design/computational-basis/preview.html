<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Computational Basis — design frames</title>
<style>
  body { margin: 0; padding: 32px; background: #eef0f5; font-family: Poppins, Arial, sans-serif; color: #25212d; }
  h1 { margin: 0 0 4px; font-size: 22px; color: #54248f; }
  p.lede { margin: 0 0 28px; font-size: 12px; color: #75717e; }
  section { margin-bottom: 34px; }
  h2 { margin: 0 0 8px; font-size: 13px; }
  h2 span { margin-left: 8px; font-family: Consolas, monospace; font-size: 10px; color: #75717e; font-weight: 400; }
  .shot { background: #fff; border: 1px solid #e8e7ed; border-radius: 8px; overflow: hidden; }
  img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<h1>Computational Basis — design frames</h1>
<p class="lede">Rendered from the generated SVG. Each file drags into Figma as its own frame.</p>
<div id="list"></div>
<script>
  const frames = [
    ['01-computations.svg', 'Computations tab'],
    ['02-client-assignments.svg', 'Client assignments tab'],
    ['03-policy-engines.svg', 'Policy engines tab'],
    ['04-reference-sources.svg', 'Reference sources tab'],
    ['05-change-history.svg', 'Change history tab'],
    ['06-modal-formula-setup.svg', 'Formula editor — Formula setup'],
    ['07-modal-test-calculation.svg', 'Formula editor — Test calculation'],
    ['08-modal-change-details.svg', 'Formula editor — Change details'],
    ['09-drawer-computation-detail.svg', 'Computation detail drawer'],
    ['10-modal-add-assignment.svg', 'Add computation assignment'],
    ['11-modal-reference-table.svg', 'Manage reference table'],
    ['12-modal-delete-computation.svg', 'Delete company computation'],
    ['13-style-sheet.svg', 'Style sheet'],
  ];
  document.getElementById('list').innerHTML = frames.map(([file, label]) =>
    `<section><h2>${label}<span>${file}</span></h2>`
    + `<div class="shot"><img src="${file}" alt="${label}"></div></section>`).join('');
</script>
</body>
</html>
