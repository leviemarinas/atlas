<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540"><g id="12 Delete company computation"><rect x="0" y="0" width="1600" height="540" fill="#f7f8fb"/><rect x="0" y="0" width="1600" height="540" fill="#1a171f" opacity="0.62" id="Backdrop"/><g id="Delete dialog"><rect x="560" y="149.6" width="480" height="240.8" rx="3" fill="#ffffff" stroke="#54248f" stroke-width="2"/><text x="578" y="184.63" font-family="Poppins, Arial, sans-serif" font-size="17" fill="#25212d" font-weight="500">Delete company computation</text><line x1="560" y1="207.6" x2="1040" y2="207.6" stroke="#e6e4ea" stroke-width="1"/><g transform="translate(991.5 168.1) scale(0.875)" fill="none" stroke="#25212d" stroke-width="2.17" stroke-linecap="round" stroke-linejoin="round"><line x1="5.5" y1="5.5" x2="18.5" y2="18.5" stroke="#25212d"/><line x1="18.5" y1="5.5" x2="5.5" y2="18.5" stroke="#25212d"/></g><text x="580" y="237.6" font-family="Poppins, Arial, sans-serif" font-size="16" fill="#25212d">Delete CUS-001 · Night Shift Allowance from this</text><text x="580" y="260" font-family="Poppins, Arial, sans-serif" font-size="16" fill="#25212d">company’s computation library?</text><text x="580" y="288.4" font-family="Poppins, Arial, sans-serif" font-size="13" fill="#25212d">It will no longer be available for new assignments. Atlas standard</text><text x="580" y="306.4" font-family="Poppins, Arial, sans-serif" font-size="13" fill="#25212d">computations are not affected.</text><rect x="891.86" y="352.4" width="148.14" height="38" rx="4" fill="#d93b55"/><g transform="translate(906.86 363.9) scale(0.625)" fill="none" stroke="#ffffff" stroke-width="3.04" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7" stroke="#ffffff"/><path d="M6.5 7v12a1.5 1.5 0 0 0 1.5 1.5h8a1.5 1.5 0 0 0 1.5-1.5V7" stroke="#ffffff"/><path d="M9.5 7V4.8h5V7" stroke="#ffffff"/><line x1="10.3" y1="10.6" x2="10.3" y2="17" stroke="#ffffff"/><line x1="13.7" y1="10.6" x2="13.7" y2="17" stroke="#ffffff"/></g><text x="928.86" y="375.3" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="500">Delete computation</text><rect x="818.65" y="352.4" width="64.21" height="38" rx="4" fill="#ffffff" stroke="#b98ee3" stroke-width="1"/><text x="833.65" y="375.3" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#7a40b4" font-weight="500">Cancel</text></g><g id="Notes"><rect x="440" y="420.4" width="720" height="63.5" rx="6" fill="#ffffff" stroke="#e2d6ee" stroke-width="1" opacity="0.92"/><text x="452" y="440.4" font-family="Poppins, Arial, sans-serif" font-size="8.5" fill="#5a4d64">Reachable only for admin-defined computations, and only when no assignment still references the code — otherwise the row action raises an error toast instead of opening this</text><text x="452" y="452.9" font-family="Poppins, Arial, sans-serif" font-size="8.5" fill="#5a4d64">dialog. Two measurement notes carried over from styles.css: this body copy inherits the 16px browser default (every other basis surface sets its own size), and .modal-actions</text><text x="452" y="465.4" font-family="Poppins, Arial, sans-serif" font-size="8.5" fill="#5a4d64">here has no horizontal padding, so the buttons sit flush against the modal border.</text></g></g></svg>